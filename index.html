<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toko GasFee Store</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f6fa;
      color: #333;
    }
    header {
      background: #2c3e50;
      color: white;
      padding: 20px;
      text-align: center;
    }
    nav {
      background: #34495e;
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 10px;
    }
    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.3s;
    }
    nav a:hover {
      color: #f1c40f;
    }
    .container {
      padding: 40px;
      max-width: 1000px;
      margin: auto;
    }
    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }
    .product {
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: center;
    }
    .product img {
      max-width: 100%;
      border-radius: 10px;
    }
    .product h3 {
      margin: 15px 0 10px;
    }
    .product p {
      color: #555;
    }
    .product button {
      background: #5865F2; /* Warna khas Discord */
      border: none;
      padding: 10px 15px;
      color: white;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 10px;
      transition: 0.3s;
    }
    .product button:hover {
      background: #4752C4;
    }
    footer {
      text-align: center;
      padding: 20px;
      margin-top: 40px;
      background: #2c3e50;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>✨ GasFee Store ✨</h1>
    <p>Jual beli token & layanan dengan harga terjangkau</p>
  </header>

  <nav>
    <a href="#">Beranda</a>
    <a href="#">Produk</a>
    <a href="#">Kontak</a>
  </nav>

  <div class="container">
    <h2>Produk Kami</h2>
    <div class="products">
      <div class="product">
        <img src="https://via.placeholder.com/250x150" alt="Produk 1">
        <h3>Token Ethereum (ETH)</h3>
        <p>Minimal order 15k</p>
        <button onclick="window.open('https://discord.gg/INVITELINK')">Beli via Discord</button>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/250x150" alt="Produk 2">
        <h3>Token Polygon (MATIC)</h3>
        <p>Minimal order 8k</p>
        <button onclick="window.open('https://discord.gg/INVITELINK')">Beli via Discord</button>
      </div>
      <div class="product">
        <img src="https://via.placeholder.com/250x150" alt="Produk 3">
        <h3>Jasa Topup GasFee</h3>
        <p>Isi ulang saldo gas fee sesuai kebutuhanmu</p>
        <button onclick="window.open('https://discord.gg/INVITELINK')">Pesan via Discord</button>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2025 GasFee Store | Hubungi kami via Discord 🚀</p>
  </footer>
</body>
</html>
